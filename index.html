<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Là où on s'est embrassés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
/* Une seule ambiance : carte de nuit, encre prune, baisers en rose corail.
   Mise en page : la carte occupe tout l'écran, une étiquette discrète en haut à gauche. */
:root {
  --mer: #17132a;
  --terre: #261f3d;
  --trait: #3d3260;
  --texte: #e9e1f5;
  --texte-doux: #a99cc4;
  --baiser: #ff5d7d;
  --font-titre: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-texte: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--mer); color: var(--texte); font-family: var(--font-texte); }
#carte { position: absolute; inset: 0; background: var(--mer); }
.leaflet-container { background: var(--mer); font-family: var(--font-texte); outline: none; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--mer) 75%, transparent) !important; color: var(--texte-doux); font-size: 10px; }
.leaflet-control-attribution a { color: var(--texte-doux); }
.leaflet-tile-pane { filter: sepia(.25) hue-rotate(215deg) saturate(1.3) brightness(1.08); }

.etiquette {
  position: absolute; z-index: 1000; top: 14px; left: 14px; max-width: calc(100% - 28px);
  display: flex; align-items: center; gap: 12px;
  padding: 8px 10px 8px 14px; border-radius: 14px;
  background: color-mix(in srgb, var(--mer) 82%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--trait); box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.etiquette h1 { margin: 0; font-family: var(--font-titre); font-style: italic; font-weight: 600; font-size: 21px; line-height: 1.1; text-wrap: balance; }
.etiquette .compte { font-size: 12.5px; color: var(--texte-doux); font-variant-numeric: tabular-nums; margin-top: 2px; }
.etiquette .compte b { color: var(--baiser); font-weight: 700; }
.etiquette button {
  flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--trait);
  background: transparent; color: var(--texte-doux); cursor: pointer; display: grid; place-items: center;
}
.etiquette button:hover { color: var(--texte); border-color: var(--texte-doux); }
.etiquette button:focus-visible, .message button:focus-visible, .bulle a:focus-visible { outline: 2px solid var(--baiser); outline-offset: 2px; }
.etiquette button.tourne svg { animation: tourne 1s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }

.message {
  position: absolute; z-index: 1000; left: 50%; bottom: 22px; transform: translateX(-50%);
  width: min(420px, calc(100% - 32px)); box-sizing: border-box;
  padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45;
  background: color-mix(in srgb, var(--mer) 90%, transparent); border: 1px solid var(--trait);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: none; gap: 10px; flex-direction: column;
}
.message.visible { display: flex; }
.message button {
  align-self: flex-start; font: 600 14px var(--font-texte); color: #1b1026; background: var(--baiser);
  border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer;
}

/* Marqueurs */
.coeur { filter: drop-shadow(0 0 6px rgba(255,93,125,.55)); transition: transform .15s; }
.coeur:hover { transform: scale(1.15); }
.grappe { display: grid; place-items: center; filter: drop-shadow(0 0 10px rgba(255,93,125,.5)); }
.grappe span { position: absolute; font: 700 12px var(--font-texte); color: #2a0f1c; font-variant-numeric: tabular-nums; margin-top: -2px; }

/* Libellés */
.nom-ville { font: 600 12px var(--font-texte); color: var(--texte-doux); white-space: nowrap; text-shadow: 0 1px 3px var(--mer), 0 0 6px var(--mer); pointer-events: none; transform: translate(-50%, -50%); }
.nom-ville.grande { font-size: 13.5px; color: var(--texte); letter-spacing: .02em; }
.nom-commune { font: 400 11px var(--font-texte); color: #8f82ad; white-space: nowrap; text-shadow: 0 1px 3px var(--mer); pointer-events: none; transform: translate(-50%, -50%); }

/* Bulle */
.leaflet-popup-content-wrapper { background: #201a36; color: var(--texte); border-radius: 14px; border: 1px solid var(--trait); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.leaflet-popup-tip { background: #201a36; border: 1px solid var(--trait); }
.leaflet-popup-content { margin: 14px 16px; font-size: 13.5px; line-height: 1.45; min-width: 190px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--texte-doux); }
.bulle h2 { margin: 0 0 2px; font-family: var(--font-titre); font-style: italic; font-weight: 600; font-size: 20px; line-height: 1.15; }
.bulle .date { color: var(--baiser); font-weight: 600; font-size: 12.5px; }
.bulle .adresse { color: var(--texte-doux); margin-top: 6px; }
.bulle a { display: inline-block; margin-top: 8px; color: var(--texte); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--baiser); }
.bulle + .bulle { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--trait); }
.liste-bulles { max-height: 260px; overflow-y: auto; }

.leaflet-bar a { background: #201a36; color: var(--texte); border-bottom-color: var(--trait); }
.leaflet-bar a:hover { background: #2c2448; color: var(--texte); }
.leaflet-bar { border: 1px solid var(--trait) !important; box-shadow: none !important; }
.leaflet-top.leaflet-right { top: 6px; right: 6px; }

.porte { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--mer) 70%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: opacity .35s; }
.porte.ouverte { opacity: 0; pointer-events: none; }
.porte-boite { width: min(340px, 100%); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  padding: 28px 24px; border-radius: 18px; background: #201a36; border: 1px solid var(--trait); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.porte-boite h2 { margin: 0; font-family: var(--font-titre); font-style: italic; font-weight: 600; font-size: 28px; line-height: 1.1; text-wrap: balance; }
.porte-boite label { font-size: 14px; color: var(--texte-doux); }
.porte-boite input { width: 100%; box-sizing: border-box; font: 600 22px var(--font-texte); letter-spacing: .3em; text-align: center; color: var(--texte);
  background: var(--mer); border: 1px solid var(--trait); border-radius: 12px; padding: 10px 12px; }
.porte-boite input:focus { outline: 2px solid var(--baiser); outline-offset: 1px; }
.porte-boite button { width: 100%; font: 700 15px var(--font-texte); color: #1b1026; background: var(--baiser); border: 0; border-radius: 12px; padding: 11px; cursor: pointer; }
.porte-boite button:disabled { opacity: .6; cursor: default; }
.porte-boite button:focus-visible { outline: 2px solid var(--texte); outline-offset: 2px; }
.porte-erreur { min-height: 1.2em; font-size: 13.5px; color: #ff9bb0; }
@media (prefers-reduced-motion: reduce) { .porte { transition: none; } }
@media (prefers-reduced-motion: reduce) { .coeur, .etiquette button.tourne svg { transition: none; animation: none; } }
@media (max-width: 420px) { .etiquette h1 { font-size: 18px; } }
</style>
</head>
<body>
<div id="carte" role="application" aria-label="Carte des endroits où on s'est embrassés"></div>

<div class="etiquette">
  <div>
    <h1>Là où on s'est embrassés</h1>
    <div class="compte" id="compte">Entre le code pour voir les baisers</div>
  </div>
</div>

<div class="porte" id="porte">
  <form class="porte-boite" id="form-code" autocomplete="off">
    <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff5d7d" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>
    <h2>Là où on s'est embrassés</h2>
    <label for="code">Entre le code pour ouvrir la carte</label>
    <input id="code" name="code" type="password" inputmode="numeric" autocomplete="off" required>
    <button type="submit" id="code-ok">Entrer</button>
    <div class="porte-erreur" id="code-erreur" role="alert"></div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
